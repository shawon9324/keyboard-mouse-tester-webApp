<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Keyboard, Mouse &amp; Gamepad Tester">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gloss)"/>

  <!-- keyboard body -->
  <rect x="9.5" y="19" width="45" height="26" rx="5.5"
        fill="#0b0f17" fill-opacity="0.22"
        stroke="#ffffff" stroke-opacity="0.92" stroke-width="2"/>

  <g fill="#ffffff">
    <!-- row 1 -->
    <g fill-opacity="0.6">
      <rect x="14"   y="24" width="5" height="4.5" rx="1.3"/>
      <rect x="21.5" y="24" width="5" height="4.5" rx="1.3"/>
      <rect x="29"   y="24" width="5" height="4.5" rx="1.3"/>
      <rect x="36.5" y="24" width="5" height="4.5" rx="1.3"/>
      <rect x="44"   y="24" width="5" height="4.5" rx="1.3"/>
    </g>
    <!-- row 2 (centre key left out — it's the lit one) -->
    <g fill-opacity="0.6">
      <rect x="14"   y="30.5" width="5" height="4.5" rx="1.3"/>
      <rect x="21.5" y="30.5" width="5" height="4.5" rx="1.3"/>
      <rect x="36.5" y="30.5" width="5" height="4.5" rx="1.3"/>
      <rect x="44"   y="30.5" width="5" height="4.5" rx="1.3"/>
    </g>
    <!-- glow + lit/“pressed” key -->
    <rect x="26.6" y="28.1" width="9.3" height="9.3" rx="2.4" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="28"   y="29.5" width="6.5" height="6.5" rx="1.7" fill="#ffffff"/>
    <!-- spacebar -->
    <rect x="18" y="38.2" width="27" height="3.6" rx="1.3" fill-opacity="0.6"/>
  </g>
</svg>
